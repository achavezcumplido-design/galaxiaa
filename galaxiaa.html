<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Universo de Amor ✨💖</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #020208;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      user-select: none;
    }
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 20px;
    }
    header h1 {
      font-size: 1.8rem;
      font-weight: 300;
      letter-spacing: 3px;
      color: #f8bbd0;
      text-shadow: 0 0 15px rgba(233, 30, 99, 0.8), 0 0 25px rgba(156, 39, 176, 0.6);
      margin-top: 10px;
      text-align: center;
    }
    footer {
      font-size: 0.85rem;
      color: #e1bee7;
      letter-spacing: 1px;
      margin-bottom: 10px;
      text-shadow: 0 0 8px rgba(0,0,0,0.9);
      text-align: center;
      background: rgba(10, 5, 20, 0.5);
      padding: 8px 16px;
      border-radius: 20px;
      backdrop-filter: blur(5px);
    }
  </style>
</head>
<body>

  <div id="canvas-container">
    <canvas id="galaxyCanvas"></canvas>
  </div>

  <div class="overlay">
    <header>
      <h1>NUESTRO UNIVERSO INFINITO ✨</h1>
    </header>

    <footer>
      Toca y arrastra para girar el universo | Las frases y corazones flotan contigo 💕
    </footer>
  </div>

  <script>
    const phrasesText = [
      "Eres mi universo entero ✨",
      "Entre millones de estrellas, te elijo a ti 💫",
      "Tu sonrisa ilumina mi cosmos ❤️",
      "Mi lugar favorito es a tu lado 💖",
      "Te amo hasta la última estrella 🪐",
      "Eres mi constelación favorita 🌟",
      "Contigo el infinito se siente cerquita 🥰",
      "Amor de mi vida 💕",
      "Siempre juntos en este universo 🌌"
    ];

    const canvas = document.getElementById('galaxyCanvas');
    const ctx = canvas.getContext('2d');

    let width, height;
    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    const numStars = 1500;
    const galaxyRadius = Math.min(width, height) * 0.45;
    const arms = 4;

    const starColors = [
      { r: 255, g: 182, b: 193 },
      { r: 240, g: 98, b: 146 },
      { r: 186, g: 104, b: 200 },
      { r: 129, g: 212, b: 250 },
      { r: 255, g: 255, b: 255 }
    ];

    class Star {
      constructor() {
        this.reset();
      }

      reset() {
        const r = Math.pow(Math.random(), 2) * galaxyRadius;
        const armAngle = ((Math.floor(Math.random() * arms)) * (2 * Math.PI / arms));
        const spiralAngle = r * 0.008;
        const totalAngle = armAngle + spiralAngle + (Math.random() - 0.5) * 0.4;

        this.x = Math.cos(totalAngle) * r;
        this.y = (Math.random() - 0.5) * (r * 0.15);
        this.z = Math.sin(totalAngle) * r;

        this.size = Math.random() * 1.6 + 0.4;
        this.color = starColors[Math.floor(Math.random() * starColors.length)];
        this.alpha = Math.random() * 0.8 + 0.2;
        this.twinkleSpeed = Math.random() * 0.02 + 0.005;
      }

      getProjected(rotX, rotY, globalRot) {
        let cosG = Math.cos(globalRot), sinG = Math.sin(globalRot);
        let x1 = this.x * cosG - this.z * sinG;
        let z1 = this.x * sinG + this.z * cosG;
        let y1 = this.y;

        let cosX = Math.cos(rotX), sinX = Math.sin(rotX);
        let y2 = y1 * cosX - z1 * sinX;
        let z2 = y1 * sinX + z1 * cosX;

        let cosY = Math.cos(rotY), sinY = Math.sin(rotY);
        let x2 = x1 * cosY + z2 * sinY;
        let z3 = -x1 * sinY + z2 * cosY;

        const perspective = 600;
        const scale = perspective / (perspective + z3 + 400);

        return {
          sx: width / 2 + x2 * scale,
          sy: height / 2 + y2 * scale,
          scale: scale,
          z: z3
        };
      }

      draw(p) {
        if (p.scale < 0) return;
        this.alpha += Math.sin(Date.now() * this.twinkleSpeed) * 0.01;
        const currentAlpha = Math.max(0.1, Math.min(1, this.alpha));

        ctx.beginPath();
        ctx.arc(p.sx, p.sy, this.size * p.scale, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, ${currentAlpha})`;
        ctx.shadowBlur = this.size * 2;
        ctx.shadowColor = `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, 0.8)`;
        ctx.fill();
        ctx.shadowBlur = 0;
      }
    }

    class FloatingHeart {
      constructor() {
        this.reset();
      }

      reset() {
        const r = Math.random() * (galaxyRadius * 1.1) + 40;
        const angle = Math.random() * Math.PI * 2;
        this.x = Math.cos(angle) * r;
        this.y = (Math.random() - 0.5) * (galaxyRadius * 0.6);
        this.z = Math.sin(angle) * r;

        this.size = Math.random() * 12 + 10;
        this.pulseSpeed = Math.random() * 0.03 + 0.01;
        this.color = Math.random() > 0.5 ? '#ff4081' : '#ff80ab';
        this.floatOffset = Math.random() * 100;
      }

      getProjected(rotX, rotY, globalRot) {
        let cosG = Math.cos(globalRot), sinG = Math.sin(globalRot);
        let x1 = this.x * cosG - this.z * sinG;
        let z1 = this.x * sinG + this.z * cosG;
        let y1 = this.y + Math.sin(Date.now() * 0.002 + this.floatOffset) * 15;

        let cosX = Math.cos(rotX), sinX = Math.sin(rotX);
        let y2 = y1 * cosX - z1 * sinX;
        let z2 = y1 * sinX + z1 * cosX;

        let cosY = Math.cos(rotY), sinY = Math.sin(rotY);
        let x2 = x1 * cosY + z2 * sinY;
        let z3 = -x1 * sinY + z2 * cosY;

        const perspective = 600;
        const scale = perspective / (perspective + z3 + 400);

        return {
          sx: width / 2 + x2 * scale,
          sy: height / 2 + y2 * scale,
          scale: scale,
          z: z3
        };
      }

      draw(p) {
        if (p.scale < 0) return;
        const animatedSize = (this.size + Math.sin(Date.now() * this.pulseSpeed) * 3) * p.scale;
        
        ctx.save();
        ctx.translate(p.sx, p.sy);
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 15 * p.scale;
        ctx.shadowColor = 'rgba(255, 64, 129, 0.9)';

        ctx.beginPath();
        const topCurveHeight = animatedSize * 0.3;
        ctx.moveTo(0, topCurveHeight);
        ctx.bezierCurveTo(0, 0, -animatedSize / 2, 0, -animatedSize / 2, topCurveHeight);
        ctx.bezierCurveTo(-animatedSize / 2, (animatedSize + topCurveHeight) / 2, 0, animatedSize, 0, animatedSize);
        ctx.bezierCurveTo(0, animatedSize, animatedSize / 2, (animatedSize + topCurveHeight) / 2, animatedSize / 2, topCurveHeight);
        ctx.bezierCurveTo(animatedSize / 2, 0, 0, 0, 0, topCurveHeight);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }
    }

    class FloatingPhrase {
      constructor(text, index, total) {
        this.text = text;
        this.index = index;
        this.total = total;
        this.reset();
      }

      reset() {
        const angle = (this.index / this.total) * Math.PI * 2 + (Math.random() * 0.3);
        const r = galaxyRadius * (0.4 + Math.random() * 0.5);
        this.x = Math.cos(angle) * r;
        this.y = (Math.random() - 0.5) * 120;
        this.z = Math.sin(angle) * r;
        this.floatOffset = Math.random() * 100;
      }

      getProjected(rotX, rotY, globalRot) {
        let cosG = Math.cos(globalRot), sinG = Math.sin(globalRot);
        let x1 = this.x * cosG - this.z * sinG;
        let z1 = this.x * sinG + this.z * cosG;
        let y1 = this.y + Math.sin(Date.now() * 0.0015 + this.floatOffset) * 20;

        let cosX = Math.cos(rotX), sinX = Math.sin(rotX);
        let y2 = y1 * cosX - z1 * sinX;
        let z2 = y1 * sinX + z1 * cosX;

        let cosY = Math.cos(rotY), sinY = Math.sin(rotY);
        let x2 = x1 * cosY + z2 * sinY;
        let z3 = -x1 * sinY + z2 * cosY;

        const perspective = 600;
        const scale = perspective / (perspective + z3 + 400);

        return {
          sx: width / 2 + x2 * scale,
          sy: height / 2 + y2 * scale,
          scale: scale,
          z: z3
        };
      }

      draw(p) {
        if (p.scale < 0.2) return;

        const fontSize = Math.max(10, Math.min(22, 14 * p.scale));
        ctx.font = `600 ${fontSize}px 'Segoe UI', sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        const textWidth = ctx.measureText(this.text).width;
        const paddingX = 14 * p.scale;
        const paddingY = 8 * p.scale;

        ctx.save();
        ctx.translate(p.sx, p.sy);

        ctx.fillStyle = 'rgba(15, 8, 28, 0.75)';
        ctx.strokeStyle = 'rgba(255, 128, 171, 0.6)';
        ctx.lineWidth = 1.5 * p.scale;
        ctx.shadowBlur = 12 * p.scale;
        ctx.shadowColor = 'rgba(236, 64, 122, 0.8)';

        ctx.beginPath();
        ctx.roundRect(
          -textWidth / 2 - paddingX,
          -fontSize / 2 - paddingY,
          textWidth + paddingX * 2,
          fontSize + paddingY * 2,
          12 * p.scale
        );
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#ffffff';
        ctx.shadowBlur = 4 * p.scale;
        ctx.shadowColor = '#ff80ab';
        ctx.fillText(this.text, 0, 0);

        ctx.restore();
      }
    }

    const stars = Array.from({ length: numStars }, () => new Star());
    const hearts = Array.from({ length: 45 }, () => new FloatingHeart());
    const phrases = phrasesText.map((txt, i) => new FloatingPhrase(txt, i, phrasesText.length));

    let rotationAngle = 0;
    let targetRotationX = 0.4;
    let targetRotationY = 0;
    let rotationX = 0.4;
    let rotationY = 0;

    let isDragging = false;
    let previousMousePosition = { x: 0, y: 0 };

    window.addEventListener('mousedown', (e) => {
      isDragging = true;
      previousMousePosition = { x: e.clientX, y: e.clientY };
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const deltaX = e.clientX - previousMousePosition.x;
      const deltaY = e.clientY - previousMousePosition.y;

      targetRotationY += deltaX * 0.004;
      targetRotationX += deltaY * 0.004;

      previousMousePosition = { x: e.clientX, y: e.clientY };
    });

    window.addEventListener('mouseup', () => isDragging = false);

    window.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        isDragging = true;
        previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      }
    });

    window.addEventListener('touchmove', (e) => {
      if (!isDragging || e.touches.length !== 1) return;
      const deltaX = e.touches[0].clientX - previousMousePosition.x;
      const deltaY = e.touches[0].clientY - previousMousePosition.y;

      targetRotationY += deltaX * 0.004;
      targetRotationX += deltaY * 0.004;

      previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    });

    window.addEventListener('touchend', () => isDragging = false);

    function animate() {
      ctx.fillStyle = 'rgba(2, 2, 8, 0.3)';
      ctx.fillRect(0, 0, width, height);

      const gradient = ctx.createRadialGradient(width / 2, height / 2, 0, width / 2, height / 2, galaxyRadius * 0.4);
      gradient.addColorStop(0, 'rgba(244, 143, 177, 0.4)');
      gradient.addColorStop(0.5, 'rgba(171, 71, 188, 0.18)');
      gradient.addColorStop(1, 'transparent');
      ctx.fillStyle = gradient;
      ctx.beginPath();
      ctx.arc(width / 2, height / 2, galaxyRadius * 0.45, 0, Math.PI * 2);
      ctx.fill();

      rotationX += (targetRotationX - rotationX) * 0.05;
      rotationY += (targetRotationY - rotationY) * 0.05;
      rotationAngle += 0.0018;

      const renderList = [];

      stars.forEach(s => {
        const p = s.getProjected(rotationX, rotationY, rotationAngle);
        renderList.push({ type: 'star', obj: s, proj: p, z: p.z });
      });

      hearts.forEach(h => {
        const p = h.getProjected(rotationX, rotationY, rotationAngle);
        renderList.push({ type: 'heart', obj: h, proj: p, z: p.z });
      });

      phrases.forEach(ph => {
        const p = ph.getProjected(rotationX, rotationY, rotationAngle);
        renderList.push({ type: 'phrase', obj: ph, proj: p, z: p.z });
      });

      renderList.sort((a, b) => b.z - a.z);

      renderList.forEach(item => {
        item.obj.draw(item.proj);
      });

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
